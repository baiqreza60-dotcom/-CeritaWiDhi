<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Stories — Yudhi & Widya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f7f7f8; --ink:#111; --frame:#000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

  /* ---------- Halaman awal ---------- */
  #home { min-height: 100%; display: flex; justify-content: center; }
  .poster { position: relative; width: min(100vw, 480px); }
  .poster img { display: block; width: 100%; height: auto; }
  .start {
    position: absolute; left: 7.3%; top: 92.3%; width: 21.6%; height: 4%;
    min-height: 34px; border: 0; border-radius: 999px; background: #fff; color: var(--ink);
    font: 700 clamp(11px, 3.6vw, 17px)/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .01em; cursor: pointer;
  }
  .start:focus-visible { outline: 3px solid #111; outline-offset: 3px; }

  /* ---------- Kamera ---------- */
  #camera { position: fixed; inset: 0; background: #000; color: #fff; display: none; flex-direction: column;
    align-items: center; padding-top: env(safe-area-inset-top, 0px); }
  #camera.on { display: flex; }
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .frame {
    --h: calc(100dvh - 168px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    width: min(100vw, calc(var(--h) * 1080 / 1510)); aspect-ratio: 1080 / 1510;
    background: var(--frame); display: flex; flex-direction: column; padding: 0 3.33% 3.33%;
  }
  .frame h1 { flex: 0 0 8.6%; display: flex; align-items: center; justify-content: center; text-align: center;
    font: 400 clamp(20px, 6.2vw, 34px)/1 "Pinyon Script", cursive; font-synthesis: none; white-space: nowrap; }
  .view { position: relative; flex: 1; overflow: hidden; background: #111; min-height: 0; }
  .view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .view video.mirror { transform: scaleX(-1); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .25s ease-out; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
  .msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: rgba(0,0,0,.82); font-size: 15px; line-height: 1.5; }
  .msg.on { display: flex; }
  .msg strong { display: block; font: 400 32px/1.1 "Pinyon Script", cursive; margin-bottom: 10px; }

  .controls { height: 168px; width: min(100vw, 480px); padding: 8px 24px calc(14px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; align-items: center; row-gap: 6px; }
  .count { grid-column: 1 / -1; text-align: center; font-size: 15px; font-weight: 700; }
  .count b { font-size: 22px; }
  .status { grid-column: 1 / -1; text-align: center; font-size: 12px; min-height: 16px; color: #bbb; order: 5; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent;
    display: grid; place-items: center; cursor: pointer; justify-self: center; }
  .shutter::after { content: ""; width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: transform .1s; }
  .shutter:active::after { transform: scale(.88); }
  .shutter:disabled { opacity: .35; cursor: not-allowed; }
  .shutter:focus-visible, .flip:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .thumb { width: 48px; height: 64px; border-radius: 6px; background: #1a1a1a center / cover; border: 1px solid #333; justify-self: start; }
  .flip { justify-self: end; width: 48px; height: 48px; border-radius: 50%; border: 1px solid #555; background: transparent; color: #fff; cursor: pointer; }
  .flip svg { width: 24px; height: 24px; }
  @media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } }
</style>
</head>
<body>

<main id="home">
  <div class="poster">
    <img src="wedding-snap.jpg" alt="Wedding Stories — Yudi Akoit dan Widya Kalle, 13 November 2026">
    <button class="start" id="startBtn" type="button" aria-label="Buka kamera untuk mengambil foto">Ambil foto</button>
  </div>
</main>

<section id="camera" aria-label="Kamera">
  <div class="stage">
    <div class="frame">
      <h1 id="title">The Wedding of Yudhi &amp; Widya</h1>
      <div class="view">
        <video id="video" autoplay playsinline muted></video>
        <div class="flash" id="flash"></div>
        <div class="msg" id="msg" role="alert"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="count" aria-live="polite">Sisa <b id="left">11</b> foto</div>
    <div class="thumb" id="thumb" aria-hidden="true"></div>
    <button class="shutter" id="shutter" type="button" aria-label="Ambil foto"></button>
    <button class="flip" id="flip" type="button" aria-label="Ganti kamera depan atau belakang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-2H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9.5 12.5a2.7 2.7 0 0 1 4.6-1.3l.6.7M14.5 13.5a2.7 2.7 0 0 1-4.6 1.3l-.6-.7"/></svg>
    </button>
    <div class="status" id="status"></div>
  </div>
</section>

<canvas id="canvas" hidden></canvas>

<script>
/* ================= PENGATURAN ================= */
const CONFIG = {
  // Isi dengan URL Web App dari Google Apps Script (lihat langkah di panduan)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz4Kqn-ZLGxXSEXeH8Koeq0jElFckT_TEZ0pEJdYQO8ROrskvgTIEMo5oEzJe8Lm6p8/exec",
  MAX_SHOTS: 11,
  TITLE: "The Wedding of Yudhi & Widya",
  STORAGE_KEY: "wedding_snap_yudhi_widya_v1",
};

/* ================= ELEMEN ================= */
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), shutter = $("shutter");
const leftEl = $("left"), statusEl = $("status"), msgEl = $("msg"), thumb = $("thumb");

/* ================= SISA JEPRETAN ================= */
function loadLeft() {
  try {
    const v = parseInt(localStorage.getItem(CONFIG.STORAGE_KEY), 10);
    if (Number.isInteger(v) && v >= 0 && v <= CONFIG.MAX_SHOTS) return v;
  } catch (e) {}
  return CONFIG.MAX_SHOTS;
}
function saveLeft(n) { try { localStorage.setItem(CONFIG.STORAGE_KEY, String(n)); } catch (e) {} }
let shotsLeft = loadLeft();
leftEl.textContent = shotsLeft;
$("title").textContent = CONFIG.TITLE;

/* ================= KAMERA ================= */
let stream = null, facing = "environment", busy = false;

function showMsg(title, text) {
  msgEl.innerHTML = "<div><strong></strong><span></span></div>";
  msgEl.querySelector("strong").textContent = title;
  msgEl.querySelector("span").textContent = text;
  msgEl.classList.add("on");
}

async function startCamera() {
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false,
    });
    video.srcObject = stream;
    video.classList.toggle("mirror", facing === "user");
    msgEl.classList.remove("on");
  } catch (err) {
    showMsg("Kamera tidak bisa dibuka", "Izinkan akses kamera di browser Anda, lalu muat ulang halaman ini.");
  }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
}

function openCamera() {
  $("home").style.display = "none";
  $("camera").classList.add("on");
  if (shotsLeft <= 0) return finished();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showMsg("Browser tidak didukung", "Buka tautan ini lewat Chrome atau Safari terbaru.");
  }
  startCamera();
}

function finished() {
  stopCamera();
  shutter.disabled = true;
  showMsg("Terima kasih", "Jatah " + CONFIG.MAX_SHOTS + " foto Anda sudah habis. Foto Anda sudah menjadi bagian dari kenangan kami.");
}

/* ================= AMBIL FOTO ================= */
// Ukuran hasil: bingkai hitam + judul di atas + foto 3:4
const W = 1080, BORDER = 36, HEADER = 130, PW = W - BORDER * 2, PH = Math.round(PW * 4 / 3);
const H = HEADER + PH + BORDER;

async function capture() {
  if (busy || shotsLeft <= 0 || !stream || !video.videoWidth) return;
  busy = true; shutter.disabled = true;

  try { await document.fonts.load('48px "Pinyon Script"'); } catch (e) {}
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  // judul
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let size = 64;
  ctx.font = size + 'px "Pinyon Script", cursive';
  while (ctx.measureText(CONFIG.TITLE).width > W - 120 && size > 24) { size -= 2; ctx.font = size + 'px "Pinyon Script", cursive'; }
  ctx.fillText(CONFIG.TITLE, W / 2, HEADER / 2 + 6);

  // foto (potong tengah agar pas 3:4)
  const vw = video.videoWidth, vh = video.videoHeight;
  const target = PW / PH;
  let sw = vw, sh = vh;
  if (vw / vh > target) sw = vh * target; else sh = vw / target;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(BORDER, HEADER, PW, PH); ctx.clip();
  if (facing === "user") { ctx.translate(BORDER + PW / 2, 0); ctx.scale(-1, 1); ctx.translate(-(BORDER + PW / 2), 0); }
  ctx.drawImage(video, sx, sy, sw, sh, BORDER, HEADER, PW, PH);
  ctx.restore();

  // efek flash + kurangi jatah
  const fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
  shotsLeft -= 1; saveLeft(shotsLeft); leftEl.textContent = shotsLeft;

  const dataUrl = canvas.toDataURL("image/jpeg", 0.86);
  thumb.style.backgroundImage = "url(" + dataUrl + ")";
  enqueue(dataUrl);

  busy = false;
  if (shotsLeft <= 0) setTimeout(finished, 700); else shutter.disabled = false;
}

/* ================= UNGGAH KE GOOGLE DRIVE ================= */
const queue = [];
let uploading = false, sent = 0;
const guestId = Math.random().toString(36).slice(2, 7);

function enqueue(dataUrl) {
  const n = ++sent;
  const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  queue.push({ filename: "tamu-" + guestId + "_" + stamp + "_" + n + ".jpg", image: dataUrl.split(",")[1] });
  flush();
}

async function flush() {
  if (uploading) return;
  uploading = true;
  while (queue.length) {
    statusEl.textContent = "Mengunggah foto… (" + queue.length + " menunggu)";
    try {
      if (CONFIG.SCRIPT_URL.indexOf("PASTE_") === 0) throw new Error("SCRIPT_URL belum diisi");
      const res = await fetch(CONFIG.SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(queue[0]),
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || "Gagal menyimpan");
      queue.shift();
    } catch (err) {
      statusEl.textContent = "Belum terkirim, mencoba lagi… (jangan tutup halaman)";
      await new Promise((r) => setTimeout(r, 4000));
    }
  }
  statusEl.textContent = "Foto tersimpan ✓";
  uploading = false;
}

window.addEventListener("beforeunload", (e) => { if (queue.length) { e.preventDefault(); e.returnValue = ""; } });

/* ================= EVENT ================= */
$("startBtn").addEventListener("click", openCamera);
shutter.addEventListener("click", capture);
$("flip").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; startCamera(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
  else if ($("camera").classList.contains("on") && shotsLeft > 0) startCamera();
});
</script>
</body>
</html>
