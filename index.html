<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disposable Camera - Wedding</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Menggunakan 100dvh agar menyesuaikan area bersih browser HP (menghindari search bar) */
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            overscroll-behavior-y: contain; 
        }
        .camera-body {
            background-color: #2b5f3a; 
            width: 100%;
            height: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1c3d25;
            border-bottom: 2px solid #111;
        }
        .film-counter {
            background-color: #000;
            color: #ff3300;
            padding: 5px 10px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #555;
            border-radius: 5px;
            font-family: 'Digital', 'Courier New', monospace;
        }
        .viewfinder-container {
            flex-grow: 1;
            position: relative;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: pan-y; 
        }
        #camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease-in-out;
            /* Tampilan live di layar menggunakan filter retro Y2K */
            filter: contrast(1.3) brightness(1.1) saturate(1.2) sepia(0.25) hue-rotate(-5deg);
        }
        .frame-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 10px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .frame-overlay::before, .frame-overlay::after {
            content: '';
            position: absolute;
            background-color: rgba(255,255,255,0.4);
        }
        .frame-overlay::before { top: 50%; left: 45%; right: 45%; height: 1px; }
        .frame-overlay::after { left: 50%; top: 45%; bottom: 45%; width: 1px; }
        
        #filter-name-display {
            position: absolute;
            top: 25px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
            pointer-events: none;
        }
        .swipe-hint {
            position: absolute;
            bottom: 60px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            z-index: 20;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        .controls {
            /* Menambahkan padding bawah 50px agar tombol naik menjauhi search bar browser */
            padding: 20px 20px 50px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #2b5f3a;
            border-top: 2px solid #111;
        }
        .side-btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .side-btn.active {
            background-color: #ffd700;
            color: black;
            border-color: #fff;
        }
        .shutter-btn {
            background-color: #ff3300;
            border: 3px solid #ccc;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 0 #991f00;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .shutter-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #991f00;
        }
        .shutter-btn:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        #screen-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 10;
        }
        #status-text {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="camera-body">
    <div class="header">
        <div>WEDDING SNAP</div>
        <div class="film-counter" id="counter">13</div>
    </div>

    <div class="viewfinder-container" id="viewfinder">
        <video id="camera-stream" autoplay playsinline></video>
        <div class="frame-overlay"></div>
        <div id="screen-flash"></div>
        
        <div id="filter-name-display">Y2K DISPOSABLE</div>
        <div class="swipe-hint">← Geser layar untuk filter →</div>
        <div id="status-text"></div>
    </div>

    <div class="controls">
        <button class="side-btn" id="flashBtn" onclick="toggleFlash()">FLASH<br>OFF</button>
        <button class="shutter-btn" id="shutterBtn" onclick="takePhoto()"></button>
        <button class="side-btn" id="zoomBtn" onclick="toggleZoom()">ZOOM<br>1X</button>
    </div>
</div>

<canvas id="photo-canvas" style="display: none;"></canvas>

<script>
    // ---------------------------------------------------------
    // MASUKKAN URL APPS SCRIPT ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4Kqn-ZLGxXSEXeH8Koeq0jElFckT_TEZ0pEJdYQO8ROrskvgTIEMo5oEzJe8Lm6p8/exec';
    // ---------------------------------------------------------

    const MAX_PHOTOS = 13;
    let photosTaken = localStorage.getItem('wedding_photos') ? parseInt(localStorage.getItem('wedding_photos')) : 0;
    
    const video = document.getElementById('camera-stream');
    const canvas = document.getElementById('photo-canvas');
    const flashBtn = document.getElementById('flashBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const shutterBtn = document.getElementById('shutterBtn');
    const counterDisplay = document.getElementById('counter');
    const statusText = document.getElementById('status-text');
    const screenFlash = document.getElementById('screen-flash');
    const filterNameDisplay = document.getElementById('filter-name-display');
    const viewfinder = document.getElementById('viewfinder');

    let stream = null;
    let imageTrack = null;
    let flashOn = false;
    let isZoomed = false;

    // Filter pertama (Y2K DISPOSABLE) dibuat persis seperti prompt Anda.
    const filters = [
        { name: 'Y2K DISPOSABLE', css: 'contrast(1.3) brightness(1.1) saturate(1.2) sepia(0.25) hue-rotate(-5deg)' },
        { name: 'B & W', css: 'grayscale(100%) contrast(1.2)' },
        { name: 'NOIR', css: 'grayscale(100%) contrast(1.5) brightness(0.9)' },
        { name: 'POLAROID', css: 'contrast(0.8) brightness(1.2) saturate(0.8) sepia(0.1)' },
        { name: 'LO-FI', css: 'contrast(1.4) saturate(1.5)' },
        { name: 'FADED', css: 'contrast(0.8) brightness(1.1)' }
    ];
    let currentFilterIdx = 0;
    let filterTimeout;

    // ----- LOGIKA GESER (SWIPE) -----
    let touchStartX = 0;
    let touchEndX = 0;

    viewfinder.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    viewfinder.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, {passive: true});

    function handleSwipe() {
        const threshold = 50; 
        if (touchEndX < touchStartX - threshold) changeFilter(1);
        if (touchEndX > touchStartX + threshold) changeFilter(-1);
    }

    function changeFilter(direction) {
        currentFilterIdx = (currentFilterIdx + direction + filters.length) % filters.length;
        const selectedFilter = filters[currentFilterIdx];
        
        video.style.filter = selectedFilter.css;
        filterNameDisplay.innerText = selectedFilter.name;
        filterNameDisplay.style.opacity = 1;

        clearTimeout(filterTimeout);
        filterTimeout = setTimeout(() => { filterNameDisplay.style.opacity = 0; }, 1500);
    }

    function updateCounterUI() {
        let remaining = MAX_PHOTOS - photosTaken;
        counterDisplay.innerText = remaining < 10 ? '0' + remaining : remaining;
        if (remaining <= 0) {
            shutterBtn.disabled = true;
            statusText.innerText = "Roll film habis! Terima kasih.";
        }
    }
    updateCounterUI();

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false
            });
            video.srcObject = stream;
            imageTrack = stream.getVideoTracks()[0];
        } catch (err) {
            alert("Gagal mengakses kamera. Tolong izinkan akses kamera di browser Anda.");
        }
    }

    async function toggleFlash() {
        flashOn = !flashOn;
        flashBtn.classList.toggle('active');
        flashBtn.innerHTML = flashOn ? "FLASH<br>ON" : "FLASH<br>OFF";
        if (imageTrack) {
            const capabilities = imageTrack.getCapabilities();
            if (capabilities.torch) {
                try { await imageTrack.applyConstraints({ advanced: [{ torch: flashOn }] }); } 
                catch (e) { console.log("Torch error", e); }
            }
        }
    }

    function toggleZoom() {
        isZoomed = !isZoomed;
        zoomBtn.classList.toggle('active');
        zoomBtn.innerHTML = isZoomed ? "ZOOM<br>2X" : "ZOOM<br>1X";
        video.style.transform = isZoomed ? 'scale(2)' : 'scale(1)';
    }

    // Fungsi Utama: Mengambil dan Memproses Foto Analog
    function takePhoto() {
        if (photosTaken >= MAX_PHOTOS) return;

        // Efek Flash
        if (flashOn) {
            screenFlash.style.opacity = 1;
            setTimeout(() => { screenFlash.style.opacity = 0; }, 150);
        } else {
            screenFlash.style.opacity = 0.5;
            setTimeout(() => { screenFlash.style.opacity = 0; }, 50);
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        // 1. Terapkan Warna/Filter (Harsh flash, high contrast, warm)
        ctx.filter = filters[currentFilterIdx].css;

        // 2. Logika Zoom & Gambar
        if (isZoomed) {
            const cropW = video.videoWidth / 2, cropH = video.videoHeight / 2;
            const sX = video.videoWidth / 4, sY = video.videoHeight / 4;
            ctx.drawImage(video, sX, sY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }
        ctx.filter = 'none';

        // 3. Sentuhan "Warm/Yellowish Vintage" yang memudar
        ctx.fillStyle = 'rgba(255, 180, 0, 0.08)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 4. Efek Vignette Samar (Gelap di tepi)
        const gradient = ctx.createRadialGradient(
            canvas.width/2, canvas.height/2, canvas.width * 0.45,
            canvas.width/2, canvas.height/2, canvas.width * 0.85
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 5. Film Grain yang Tajam (Memanipulasi piksel)
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imgData.data;
        for (let i = 0; i < pixels.length; i += 4) {
            // Menghasilkan noise/bintik acak antara -25 hingga +25
            const noise = (Math.random() - 0.5) * 50; 
            pixels[i] += noise;     // Merah
            pixels[i+1] += noise;   // Hijau
            pixels[i+2] += noise;   // Biru
        }
        ctx.putImageData(imgData, 0, 0);

        const base64Data = canvas.toDataURL('image/jpeg', 0.8);

        photosTaken++;
        localStorage.setItem('wedding_photos', photosTaken);
        updateCounterUI();
        sendToDrive(base64Data);
    }

    function sendToDrive(base64Data) {
        statusText.innerText = "Mencuci film... ⏳";
        
        const payload = {
            base64: base64Data,
            filename: 'RetroSnap_' + Date.now() + '.jpg',
            mimeType: 'image/jpeg'
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(response => response.json())
        .then(data => {
            if
